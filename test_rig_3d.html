<meta charset="utf-8">
<title>ชุดทดสอบเสา-คาน BC01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D stage, a slim title strip, view presets bottom-left, part list right (stacks under on phones) */
  :root {
    --bg: #eef0f2;
    --stage: #e3e6ea;
    --panel: #ffffff;
    --ink: #1d232b;
    --muted: #5d6773;
    --line: #cfd5dc;
    --accent: #2f5fd0;
    --grid: #b9c0c8;
    --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d; --stage: #1b2027; --panel: #20262e; --ink: #e7ebef; --muted: #9aa5b1;
      --line: #333c47; --accent: #7fa2ff; --grid: #3a434e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181d; --stage: #1b2027; --panel: #20262e; --ink: #e7ebef; --muted: #9aa5b1;
    --line: #333c47; --accent: #7fa2ff; --grid: #3a434e; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-size: 0.82rem; }
  .spec { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  main { flex: 1; min-height: 0; display: flex; position: relative; }
  #stage { flex: 1; min-width: 0; position: relative; background: var(--stage); touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  .views {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  button {
    font: 500 0.82rem var(--font-body); color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .hint {
    position: absolute; right: 12px; bottom: 12px; color: var(--muted); font-size: 0.75rem;
    background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 4px 8px; border-radius: 6px;
  }
  aside {
    width: 260px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    padding-block: 14px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  aside h2 { margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .parts li { display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 10px; padding: 5px 4px; font-size: 0.86rem; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgb(0 0 0 / 0.25); }
  .parts small { display: block; color: var(--muted); font-size: 0.72rem; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.82rem; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  .toggles { display: flex; flex-direction: column; gap: 6px; font-size: 0.86rem; }
  .toggles label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { flex: 1; padding: 5px 8px; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.9rem; pointer-events: none; }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    #stage { min-height: 58vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 42%; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
    .hint { display: none; }
  }
</style>

<header>
  <h1>ชุดทดสอบเสา-คานเหล็กหน้าตัดเรียว BC01</h1>
</header>
<main>
  <div id="stage">
    <div id="status">กำลังโหลดแบบจำลอง…</div>
    <div class="views" role="group" aria-label="มุมมอง">
      <button type="button" data-view="iso" aria-pressed="true">3 มิติ</button>
      <button type="button" data-view="side" aria-pressed="false">ด้านข้าง</button>
      <button type="button" data-view="front" aria-pressed="false">ด้านหน้า</button>
      <button type="button" data-view="top" aria-pressed="false">ด้านบน</button>
    </div>
    <div class="hint">ลากเพื่อหมุน · ล้อเมาส์เพื่อซูม · คลิกขวาลากเพื่อเลื่อน</div>
  </div>
  <aside>
    <section>
      <h2>สีของชิ้นส่วน</h2>
      <ul class="parts" id="parts"></ul>
    </section>
    <section class="toggles">
      <h2>การแสดงผล</h2>
      <label><input type="checkbox" id="opt-edges" checked> เส้นขอบ</label>
      <label><input type="checkbox" id="opt-spin"> หมุนอัตโนมัติ</label>
      <div class="seg" role="group" aria-label="ธีมพื้นหลัง">
        <button type="button" data-theme-choice="light" aria-pressed="false">สว่าง</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">มืด</button>
        <button type="button" data-theme-choice="system" aria-pressed="true">ตามระบบ</button>
      </div>
    </section>
  </aside>
</main>

// colour of each SketchUp material -> part name shown in the list
const PARTS = [
  { key: 'f1',   rgb: [220, 40, 40],   name: 'โครงเฟรมชุดที่ 1', note: 'เสา H-375, C-channel รับแรง' },
  { key: 'f2',   rgb: [60, 100, 220],  name: 'โครงเฟรมชุดที่ 2', note: 'เสา H-187.5, ค้ำยันด้านข้าง' },
  { key: 'spec', rgb: [150, 60, 170],  name: 'ตัวอย่างและคานบนหัวเสา', note: 'BC01 หน้าตัดเรียว' },
  { key: 'tb',   rgb: [150, 150, 150], name: 'คานถ่ายแรง', note: 'พร้อมแท่งรอง Load Cell' },
  { key: 'jack', rgb: [60, 60, 60],    name: 'Hydraulic Jack', note: 'ตำแหน่งให้แรงกระทำ' },
  { key: 'lc',   rgb: [200, 205, 210], name: 'Load Cell', note: 'วางแนวนอน' },
  { key: 'pin',  rgb: [240, 150, 30],  name: 'Pin Support', note: 'หมุนได้แกนเดียว' },
];

const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 10, 100000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-3500, 6000, 4500);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3500, right: 3500, top: 3500, bottom: -3500, near: 100, far: 20000 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
let grid = null;

const groups = Object.fromEntries(PARTS.map(p => [p.key, []]));
const edgeLines = [];
let box = new THREE.Box3();

function themeColors() {
  scene.background = new THREE.Color(css('--stage'));
  if (grid) scene.remove(grid);
  grid = new THREE.GridHelper(6000, 24, new THREE.Color(css('--grid')), new THREE.Color(css('--grid')));
  grid.material.transparent = true; grid.material.opacity = 0.55;
  grid.position.y = 0.5;
  scene.add(grid);
}
themeColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeColors);
new MutationObserver(themeColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function partFor(color) {
  const rgb = [color.r * 255, color.g * 255, color.b * 255];   // exporter stores the SketchUp sRGB values as-is
  let best = PARTS[0], d0 = Infinity;
  for (const p of PARTS) {
    const d = p.rgb.reduce((s, v, i) => s + (v - rgb[i]) ** 2, 0);
    if (d < d0) { d0 = d; best = p; }
  }
  return best.key;
}

function buildList() {
  const ul = document.getElementById('parts');
  for (const p of PARTS) {
    if (!groups[p.key].length) continue;
    const li = document.createElement('li');
    li.innerHTML = `<span class="sw" style="background:rgb(${p.rgb.join(',')})"></span>
      <span>${p.name}<small>${p.note}</small></span>`;
    ul.append(li);
  }
}

const VIEWS = {
  iso:   (c, r) => [c.x - r * 1.5, c.y + r * 1.05, c.z + r * 1.8],
  side:  (c, r) => [c.x, c.y, c.z + r * 3.4],
  front: (c, r) => [c.x - r * 3.4, c.y, c.z],
  top:   (c, r) => [c.x + 1, c.y + r * 3.4, c.z],
};
let anim = null;
function setView(name, instant) {
  const center = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length() * 0.5;
  const to = new THREE.Vector3(...VIEWS[name](center, r));
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduce) { camera.position.copy(to); controls.target.copy(center); controls.update(); return; }
  anim = { from: camera.position.clone(), to, t0: performance.now(), tFrom: controls.target.clone(), tTo: center };
}
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('opt-edges').addEventListener('change', (e) => edgeLines.forEach(l => l.visible = e.target.checked));
const themeBtns = document.querySelectorAll('[data-theme-choice]');
function applyTheme(choice) {
  const root = document.documentElement;
  if (choice === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', choice);
  themeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === choice)));
  themeColors();
  try { localStorage.setItem('rig3d-theme', choice); } catch (e) {}
}
themeBtns.forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.themeChoice)));
try { const saved = localStorage.getItem('rig3d-theme'); if (saved) applyTheme(saved); } catch (e) {}
document.getElementById('opt-spin').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; controls.autoRotateSpeed = 1.2; });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

function loop(now) {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / 700), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(anim.from, anim.to, e);
    controls.target.lerpVectors(anim.tFrom, anim.tTo, e);
    if (k >= 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const bytes = Uint8Array.from(atob(GLB_B64), c => c.charCodeAt(0));
new THREE.GLTFLoader().parse(bytes.buffer, '', (gltf) => {
  const model = gltf.scene;
  model.scale.setScalar(25.4);              // SketchUp inches -> mm
  model.rotation.x = -Math.PI / 2;          // Z-up -> Y-up
  model.updateMatrixWorld(true);
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x111418, transparent: true, opacity: 0.55 });
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const key = partFor(o.material.color);
    const p = PARTS.find(q => q.key === key);
    const col = new THREE.Color().setRGB(p.rgb[0] / 255, p.rgb[1] / 255, p.rgb[2] / 255).convertSRGBToLinear();
    o.material = new THREE.MeshStandardMaterial({ color: col, metalness: 0.2, roughness: 0.6, side: THREE.DoubleSide });
    groups[key].push(o);
    const pos = new THREE.BufferGeometry();
    pos.setAttribute('position', o.geometry.getAttribute('position'));
    if (o.geometry.index) pos.setIndex(o.geometry.index);
    const welded = THREE.BufferGeometryUtils.mergeVertices(pos, 1e-3);
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(welded, 20), edgeMat);
    o.add(lines); edgeLines.push(lines);
  });
  scene.add(model);
  box = new THREE.Box3().setFromObject(model);
  statusEl.hidden = true;
  buildList();
  resize();
  setView('iso', true);
  requestAnimationFrame(loop);
}, (err) => { statusEl.textContent = 'โหลดแบบจำลองไม่สำเร็จ: ' + (err && err.message || err); });
</script>
